{# Standalone 403 / 404 error page (rendered by core/views.py). #}
{% load static %}<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{% static 'css/main.css' %}" rel="stylesheet"></head>
<body class="d-grid min-vh-100 place-items-center" style="place-items:center">
  <div class="text-center p-4">
    <span class="brand-logo mx-auto mb-3" style="width:64px;height:64px;font-size:2rem"><i class="bi bi-shield-lock"></i></span>
    <div class="display-4 fw-bold text-primary">{{ code }}</div>
    <h1 class="h4">{{ title }}</h1>
    <p class="text-muted">{{ message }}</p>
    <a class="btn btn-primary" href="{% url 'dashboard:home' %}"><i class="bi bi-house me-1"></i>Back to dashboard</a>
  </div>
</body></html>
