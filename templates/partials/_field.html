{# One labelled form field with error text. Use: { % include "partials/_field.html" with field=form.name col="col-md-6" % } #}
<div class="{{ col|default:'col-md-6' }} {% if field.errors %}field-has-error{% endif %}">
  <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if field.field.required %}<span class="text-danger"> *</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
</div>
